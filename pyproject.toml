[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-jjonku"
version = "0.1.0"
description = "A constrained MCP gateway for a VS Code workspace."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
